<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>VUKRAX Transport</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101820;--p:#18232d;--p2:#202e3a;--t:#f4f7fa;--m:#a9b7c4;--a:#e8b339;--l:#334553}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif}.app{max-width:620px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 0 20px}.brand{display:flex;gap:10px;align-items:center}.mark{width:44px;height:44px;border-radius:12px;background:var(--a);color:#101820;display:grid;place-items:center;font-size:22px;font-weight:900}.brand h1{font-size:19px;margin:0;letter-spacing:1px}.brand small{color:var(--m);letter-spacing:2px}select,input,textarea{width:100%;padding:12px;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:11px;font:inherit}label{display:block;color:var(--m);font-size:13px;margin-bottom:7px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px;margin:12px 0}.card h2{font-size:16px;margin:0 0 12px}.field{margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.btn{border:1px solid var(--l);border-radius:11px;padding:11px;background:var(--p2);color:var(--t);font-weight:650}.add{width:100%;margin:3px 0 8px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--l);border-radius:11px;padding:11px}.check input{width:18px;height:18px;accent-color:var(--a)}.note{color:var(--m);font-size:12px}.price{display:flex;justify-content:space-between;align-items:center;gap:12px}.price strong{color:var(--a);font-size:22px}.submit{width:100%;margin-top:12px;background:var(--a);color:#111820;border:0;padding:15px;font-size:16px;font-weight:800}.status{font-size:13px;color:var(--m);margin-top:10px;min-height:18px}.error{color:#ff7979}footer{text-align:center;color:var(--m);font-size:11px;margin:20px 0}.hidden{display:none}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="mark">V</div><div><h1>VUKRAX</h1><small>TRANSPORT</small></div></div><select id="lang" style="width:112px;padding:8px"><option value="ru">Русский</option><option value="sr">Srpski</option><option value="en">English</option></select></header>
<section class="card"><h2 data-k="routeTitle">Маршрут</h2><div class="field"><label data-k="pickupLabel">Откуда — город, улица, дом</label><div class="addrrow"><input id="pickup" placeholder="Novi Sad, Bulevar oslobođenja 10"><button type="button" class="btn mapbtn" data-map-for="pickup">📍 Карта</button></div></div><div id="stops"></div><button class="btn add" id="addStop" data-k="addStop">＋ Добавить промежуточную точку</button><div class="field"><label data-k="destLabel">Куда — город, улица, дом</label><div class="addrrow"><input id="destination" placeholder="Beograd, Knez Mihailova 5"><button type="button" class="btn mapbtn" data-map-for="destination">📍 Карта</button></div></div><div class="field"><label data-k="dateLabel">Дата и время перевозки</label><input id="date" type="datetime-local"></div></section>
<section class="card"><h2 data-k="cargoTitle">Груз</h2><div class="field"><label data-k="cargoLabel">Что перевозим?</label><textarea id="cargo" rows="2"></textarea></div><div class="grid"><div class="field"><label data-k="dimsLabel">Габариты, м (Д/Ш/В)</label><input id="dims" placeholder="1.2 / 0.8 / 0.6"></div><div class="field"><label data-k="weightLabel">Вес, кг</label><input id="weight" type="number" min="0" step="0.1"></div></div><div class="field"><label data-k="photoLabel">Фото груза (необязательно)</label><input id="photo" type="file" accept="image/*" capture="environment"><p class="note" data-k="photoNote">Выбор фото пока не загружает его в Telegram; для этого нужна доработка бота.</p></div><div class="checks"><label class="check"><input id="loading" type="checkbox"><span data-k="loading">Нужна погрузка</span></label><label class="check"><input id="unloading" type="checkbox"><span data-k="unloading">Нужна разгрузка</span></label></div></section>
<section class="card"><h2 data-k="contactTitle">Контактные данные</h2><div class="grid"><div class="field"><label data-k="nameLabel">Имя</label><input id="name" autocomplete="name"></div><div class="field"><label data-k="phoneLabel">Телефон</label><input id="phone" type="tel" placeholder="+381…" autocomplete="tel"></div></div></section>
<section class="card"><div class="price"><div><div data-k="priceLabel">Стоимость</div><div class="note" data-k="priceNote">Расстояние — ориентировочное; цену подтверждает диспетчер</div></div><strong id="price">—</strong></div><button class="submit" id="send" data-k="submit">Отправить заявку</button><div class="status" id="status"></div></section><footer>VUKRAX Transport · <span data-k="footer">Перевозки по Сербии</span></footer>
</main>
<script>
(()=>{const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}const $=x=>document.getElementById(x);let stops=[],km=null,timer,mapInstance=null,mapMarker=null,mapTarget=null,mapSelected=null;
const T={
ru:{mapButton:"📍 Карта",mapTitle:"Выберите адрес на карте",mapSearch:"Найти",mapConfirm:"Подтвердить адрес",mapCancel:"Отмена",routeTitle:"Маршрут",pickupLabel:"Откуда — город, улица, дом",destLabel:"Куда — город, улица, дом",dateLabel:"Дата и время перевозки",addStop:"＋ Добавить промежуточную точку",stop:"Промежуточная точка",remove:"×",cargoTitle:"Груз",cargoLabel:"Что перевозим?",dimsLabel:"Габариты, м (Д/Ш/В)",weightLabel:"Вес, кг",photoLabel:"Фото груза (необязательно)",photoNote:"Выбор фото пока не загружает его в Telegram; для этого нужна доработка бота.",loading:"Нужна погрузка",unloading:"Нужна разгрузка",contactTitle:"Контактные данные",nameLabel:"Имя",phoneLabel:"Телефон",priceLabel:"Стоимость",priceNote:"Расстояние — ориентировочное; цену подтверждает диспетчер",submit:"Отправить заявку",footer:"Перевозки по Сербии",missing:"Заполните адреса отправления и доставки.",notTelegram:"Откройте Mini App через Telegram-бота.",sent:"Заявка передана боту. Дождитесь ответа в Telegram.",calculating:"Рассчитываем расстояние…",routeError:"Не удалось рассчитать маршрут. Проверьте адреса.",network:"Нет соединения для расчёта маршрута."},
sr:{mapButton:"📍 Mapa",mapTitle:"Izaberite adresu na mapi",mapSearch:"Pronađi",mapConfirm:"Potvrdi adresu",mapCancel:"Otkaži",routeTitle:"Ruta",pickupLabel:"Preuzimanje — grad, ulica, broj",destLabel:"Isporuka — grad, ulica, broj",dateLabel:"Datum i vreme prevoza",addStop:"＋ Dodaj međutačku",stop:"Međutačka",remove:"×",cargoTitle:"Teret",cargoLabel:"Šta prevozimo?",dimsLabel:"Dimenzije, m (D/Š/V)",weightLabel:"Težina, kg",photoLabel:"Fotografija tereta (opciono)",photoNote:"Izabrana fotografija se još ne šalje botu; potrebna je dorada.",loading:"Potrebna pomoć pri utovaru",unloading:"Potrebna pomoć pri istovaru",contactTitle:"Kontakt podaci",nameLabel:"Ime",phoneLabel:"Telefon",priceLabel:"Cena",priceNote:"Udaljenost je okvirna; dispečer potvrđuje cenu",submit:"Pošalji zahtev",footer:"Prevoz u Srbiji",missing:"Unesite adresu preuzimanja i isporuke.",notTelegram:"Otvorite Mini App preko Telegram bota.",sent:"Zahtev je prosleđen botu. Sačekajte odgovor u Telegramu.",calculating:"Računanje udaljenosti…",routeError:"Ruta nije izračunata. Proverite adrese.",network:"Nema mrežne veze za računanje rute."},
en:{mapButton:"📍 Map",mapTitle:"Choose address on map",mapSearch:"Search",mapConfirm:"Confirm address",mapCancel:"Cancel",routeTitle:"Route",pickupLabel:"Pickup — city, street, number",destLabel:"Delivery — city, street, number",dateLabel:"Transport date and time",addStop:"＋ Add intermediate stop",stop:"Intermediate stop",remove:"×",cargoTitle:"Cargo",cargoLabel:"What are we transporting?",dimsLabel:"Dimensions, m (L/W/H)",weightLabel:"Weight, kg",photoLabel:"Cargo photo (optional)",photoNote:"Selecting a photo does not upload it yet; the bot needs an additional feature.",loading:"Loading help needed",unloading:"Unloading help needed",contactTitle:"Contact details",nameLabel:"Name",phoneLabel:"Phone",priceLabel:"Price",priceNote:"Distance is an estimate; dispatcher confirms the price",submit:"Send request",footer:"Transport in Serbia",missing:"Enter pickup and delivery addresses.",notTelegram:"Open the Mini App through the Telegram bot.",sent:"Request passed to the bot. Wait for a reply in Telegram.",calculating:"Calculating distance…",routeError:"Could not calculate route. Check the addresses.",network:"No network connection for route calculation."}};
function tr(k){return T[$('lang').value][k]||T.ru[k]||k}function status(s,err=false){$('status').textContent=s;$('status').classList.toggle('error',err)}
function lang(){document.querySelectorAll('[data-k]').forEach(e=>{let k=e.dataset.k;if(T[$('lang').value][k])e.textContent=T[$('lang').value][k]});document.querySelectorAll('.stoplabel').forEach(e=>e.textContent=tr('stop'));document.querySelectorAll('.mapbtn').forEach(e=>e.textContent=tr('mapButton'));$('mapTitle').textContent=tr('mapTitle');$('mapSearchBtn').textContent=tr('mapSearch');$('confirmMap').textContent=tr('mapConfirm');$('cancelMap').textContent=tr('mapCancel');}
$('lang').onchange=lang;
$('addStop').onclick=()=>{let id=Date.now()+Math.random(),d=document.createElement('div');d.className='field';d.dataset.id=id;d.innerHTML='<label class="stoplabel"></label><div class="addrrow"><input class="stopinput" placeholder="City, street, number"><button type="button" class="btn mapbtn" data-map-stop="1">📍 Карта</button><button type="button" class="btn remove">×</button></div>';$('stops').append(d);d.querySelector('label').textContent=tr('stop');d.querySelector('button').onclick=()=>{d.remove();estimate()};d.querySelector('input').onchange=estimate};
function addrs(){return [$('pickup').value.trim(),...Array.from(document.querySelectorAll('.stopinput')).map(x=>x.value.trim()).filter(Boolean),$('destination').value.trim()]}
async function geo(q,field){if(field?.dataset.lat&&field?.dataset.lon)return [+field.dataset.lon,+field.dataset.lat];let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));let j=await r.json();if(!j.length)throw Error();return [+j[0].lon,+j[0].lat]}
async function estimate(){km=null;$('price').textContent='—';let fields=[$('pickup'),...Array.from(document.querySelectorAll('.stopinput')), $('destination')].filter(x=>x.value.trim());let a=fields.map(x=>x.value.trim());if(!a[0]||!a[a.length-1])return;status(tr('calculating'));try{let c=[];for(let i=0;i<a.length;i++)c.push(await geo(a[i],fields[i]));let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+c.map(x=>x.join(',')).join(';')+'?overview=false');let j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error();km=+(j.routes[0].distance/1000).toFixed(2);$('price').textContent=km+' km';status('')}catch(e){status(tr('routeError'),true)}}
['pickup','destination'].forEach(id=>$(id).addEventListener('input',e=>{delete e.target.dataset.lat;delete e.target.dataset.lon;clearTimeout(timer);timer=setTimeout(estimate,250)}));
function openMap(field){mapTarget=field;mapSelected=null;$('mapModal').classList.add('open');$('mapSearchInput').value=field.value||'';$('mapAddress').textContent=field.value||'Нажмите на карту, чтобы выбрать точку.';if(!mapInstance){mapInstance=L.map('mapCanvas').setView([44.0165,21.0059],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapInstance);mapInstance.on('click',e=>selectMapPoint(e.latlng));}setTimeout(()=>mapInstance.invalidateSize(),150);if(field.dataset.lat&&field.dataset.lon){let p=[Number(field.dataset.lat),Number(field.dataset.lon)];mapInstance.setView(p,16);selectMapPoint({lat:p[0],lng:p[1]});}else if(field.value.trim()){searchMapAddress(field.value.trim());}}
async function selectMapPoint(p){mapSelected={lat:p.lat,lon:p.lng};if(!mapMarker)mapMarker=L.marker(p,{draggable:true}).addTo(mapInstance);else mapMarker.setLatLng(p);mapMarker.off('dragend').on('dragend',e=>selectMapPoint(e.target.getLatLng()));$('mapAddress').textContent='Определяем адрес…';try{let r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+p.lat+'&lon='+p.lng+'&zoom=18&addressdetails=1');let j=await r.json();mapSelected.label=j.display_name||`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;}catch(e){mapSelected.label=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;}$('mapAddress').textContent=mapSelected.label;}
async function searchMapAddress(q){try{$('mapAddress').textContent='Ищем адрес…';let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=rs&q='+encodeURIComponent(q));let j=await r.json();if(!j.length){$('mapAddress').textContent='Адрес не найден. Выберите точку на карте.';return;}let p={lat:Number(j[0].lat),lng:Number(j[0].lon)};mapInstance.setView(p,17);selectMapPoint(p);}catch(e){$('mapAddress').textContent='Поиск не удался. Выберите точку на карте.';}}
$('mapSearchBtn').onclick=()=>{let q=$('mapSearchInput').value.trim();if(q)searchMapAddress(q)};$('mapSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('mapSearchBtn').click()}});function closeMap(){$('mapModal').classList.remove('open');mapTarget=null;}$('closeMap').onclick=closeMap;$('cancelMap').onclick=closeMap;$('confirmMap').onclick=()=>{if(!mapTarget||!mapSelected){$('mapAddress').textContent='Сначала выберите точку на карте.';return;}mapTarget.value=mapSelected.label;mapTarget.dataset.lat=String(mapSelected.lat);mapTarget.dataset.lon=String(mapSelected.lon);closeMap();estimate();};document.querySelectorAll('[data-map-for]').forEach(b=>b.addEventListener('click',()=>openMap($(b.dataset.mapFor))));
$('send').onclick=()=>{if(!$('pickup').value.trim()||!$('destination').value.trim()){status(tr('missing'),true);return}if(!tg){status(tr('notTelegram'),true);return}
let ds=$('dims').value.trim(),nums=ds?ds.split(/[\/;,xх×\s]+/).filter(Boolean).map(Number):null,dims=nums&&nums.length===3&&nums.every(x=>x>0&&Number.isFinite(x))?nums:null;
let data={type:'vukrax_transport_request',version:1,language:$('lang').value,route:{pickup:$('pickup').value.trim(),stops:Array.from(document.querySelectorAll('.stopinput')).map(x=>x.value.trim()).filter(Boolean),destination:$('destination').value.trim(),distance_km:km},date:$('date').value||null,cargo:{description:$('cargo').value.trim(),dimensions_m:dims,dimensions_raw:ds,weight_kg:$('weight').value?Number($('weight').value):null,photo_selected:!!$('photo').files?.length},services:{loading:$('loading').checked,unloading:$('unloading').checked},contact:{name:$('name').value.trim(),phone:$('phone').value.trim()},submitted_at:new Date().toISOString()};
try{tg.sendData(JSON.stringify(data));status(tr('sent'))}catch(e){status(tr('notTelegram'),true)}};
lang();
})();
</script></body></html>
