const pricing=new URLSearchParams(location.search);
function showPrice(){
 const rate=Number(pricing.get('price_large'));
 if(km===null){$('price').textContent='—';return;}
 if(!pricing.has('price_large')||!Number.isFinite(rate)||rate<0){$('price').textContent=km+' km';return;}
 const n=k=>Number(pricing.get(k)||0);
 let total=km*rate+(km<=n('dispatch_max_km')?n('dispatch_fee'):0);
 if(pricing.get('loaders_enabled')==='1')total+=($('loading').checked?n('loading_fee'):0)+($('unloading').checked?n('unloading_fee'):0);
 total=Math.round(total*100)/100;
 $('price').textContent=pricing.get('display_currency')==='RSD'?(Math.round((total*n('eur_rsd_rate')+1e-9)/100)*100)+' RSD':'€'+total.toFixed(2);
}
$('loading').onchange=showPrice;$('unloading').onchange=showPrice;
function tr(k){return T[$('lang').value][k]||T.ru[k]||k}function status(s,err=false){$('status').textContent=s;$('status').classList.toggle('error',err)}
function lang(){const names={ru:"Грузоперевозки Сербия",sr:"Prevoz tereta Srbija",en:"Cargo Transport Serbia"};const name=names[$("lang").value]||names.sr;$("brandName").textContent=name;$("footerBrand").textContent=name;document.title=name;document.documentElement.lang=$("lang").value;document.querySelectorAll('[data-k]').forEach(e=>{let k=e.dataset.k;if(T[$('lang').value][k])e.textContent=T[$('lang').value][k]});document.querySelectorAll('.stoplabel').forEach(e=>e.textContent=tr('stop'));document.querySelectorAll('.mapbtn').forEach(e=>e.textContent=tr('mapButton'));$('mapTitle').textContent=tr('mapTitle');$('mapSearchBtn').textContent=tr('mapSearch');$('confirmMap').textContent=tr('mapConfirm');$('cancelMap').textContent=tr('mapCancel');}
$('lang').onchange=lang;
$('addStop').onclick=()=>{let id=Date.now()+Math.random(),d=document.createElement('div');d.className='field';d.dataset.id=id;d.innerHTML='<label class="stoplabel"></label><div class="addrrow"><input class="stopinput" placeholder="City, street, number"><button type="button" class="btn mapbtn" data-map-stop="1">📍 Карта</button><button type="button" class="btn remove">×</button></div>';$('stops').append(d);d.querySelector('label').textContent=tr('stop');d.querySelector('.remove').onclick=()=>{d.remove();estimate()};d.querySelector('input').addEventListener('input',()=>{delete d.querySelector('input').dataset.lat;delete d.querySelector('input').dataset.lon;clearTimeout(timer);timer=setTimeout(estimate,250)})};
function addrs(){return [$('pickup').value.trim(),...Array.from(document.querySelectorAll('.stopinput')).map(x=>x.value.trim()).filter(Boolean),$('destination').value.trim()]}
async function geo(q,field){if(field?.dataset.lat&&field?.dataset.lon)return [+field.dataset.lon,+field.dataset.lat];let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));let j=await r.json();if(!j.length)throw Error();return [+j[0].lon,+j[0].lat]}
async function estimate(){
 const version=++estimateVersion;km=null;routeCoords=null;$('price').textContent='—';
 const fields=[$('pickup'),...Array.from(document.querySelectorAll('.stopinput')).filter(x=>x.value.trim()),$('destination')];
 if(!fields[0].value.trim()||!fields[fields.length-1].value.trim())return false;
 status(tr('calculating'));
 try{
  const coords=[];
  for(const field of fields)coords.push(await geo(field.value.trim(),field));
  const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords.map(x=>x.join(',')).join(';')+'?overview=false&steps=false&alternatives=false');
  if(!r.ok)throw Error('Routing HTTP '+r.status);
  const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw Error('Routing failed');
  if(version!==estimateVersion)return false;
  km=+(j.routes[0].distance/1000).toFixed(2);if(!Number.isFinite(km)||km<0.05)throw Error('Invalid route distance');
  routeCoords=coords.map(([lon,lat])=>({lat,lon}));
  showPrice();status('');return true;
 }catch(e){if(version===estimateVersion)status(tr('routeError'),true);return false;}
}
['pickup','destination'].forEach(id=>$(id).addEventListener('input',e=>{delete e.target.dataset.lat;delete e.target.dataset.lon;clearTimeout(timer);timer=setTimeout(estimate,250)}));
function openMap(field){mapTarget=field;mapSelected=null;$('mapModal').classList.add('open');$('mapSearchInput').value=field.value||'';$('mapAddress').textContent=field.value||'Нажмите на карту, чтобы выбрать точку.';if(!mapInstance){mapInstance=L.map('mapCanvas').setView([44.0165,21.0059],7);mapInstance.attributionControl.setPrefix(false);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(mapInstance);mapInstance.on('click',e=>selectMapPoint(e.latlng));}setTimeout(()=>mapInstance.invalidateSize(),150);if(field.dataset.lat&&field.dataset.lon){let p=[Number(field.dataset.lat),Number(field.dataset.lon)];mapInstance.setView(p,16);selectMapPoint({lat:p[0],lng:p[1]});}else if(field.value.trim()){searchMapAddress(field.value.trim());}}
async function selectMapPoint(p){mapSelected={lat:p.lat,lon:p.lng};if(!mapMarker)mapMarker=L.marker(p,{draggable:true}).addTo(mapInstance);else mapMarker.setLatLng(p);mapMarker.off('dragend').on('dragend',e=>selectMapPoint(e.target.getLatLng()));$('mapAddress').textContent='Определяем адрес…';try{let r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+p.lat+'&lon='+p.lng+'&zoom=18&addressdetails=1');let j=await r.json();mapSelected.label=j.display_name||`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;}catch(e){mapSelected.label=`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;}$('mapAddress').textContent=mapSelected.label;}
async function searchMapAddress(q){try{$('mapAddress').textContent='Ищем адрес…';let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=rs&q='+encodeURIComponent(q));let j=await r.json();if(!j.length){$('mapAddress').textContent='Адрес не найден. Выберите точку на карте.';return;}let p={lat:Number(j[0].lat),lng:Number(j[0].lon)};mapInstance.setView(p,17);selectMapPoint(p);}catch(e){$('mapAddress').textContent='Поиск не удался. Выберите точку на карте.';}}
$('mapSearchBtn').onclick=()=>{let q=$('mapSearchInput').value.trim();if(q)searchMapAddress(q)};$('mapSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('mapSearchBtn').click()}});function closeMap(){$('mapModal').classList.remove('open');mapTarget=null;}$('closeMap').onclick=closeMap;$('cancelMap').onclick=closeMap;$('confirmMap').onclick=()=>{if(!mapTarget||!mapSelected){$('mapAddress').textContent='Сначала выберите точку на карте.';return;}mapTarget.value=mapSelected.label;mapTarget.dataset.lat=String(mapSelected.lat);mapTarget.dataset.lon=String(mapSelected.lon);closeMap();estimate();};document.addEventListener('click',e=>{const b=e.target.closest('[data-map-for], [data-map-stop]');if(!b)return;const field=b.dataset.mapFor?$(b.dataset.mapFor):b.closest('.addrrow')?.querySelector('input');if(field)openMap(field)});
$('send').onclick=async()=>{if(!$('pickup').value.trim()||!$('destination').value.trim()){status(tr('missing'),true);return}if(!tg){status(tr('notTelegram'),true);return}const phone=$('phone').value.trim();if(phone.replace(/\D/g,'').length<7||phone.replace(/\D/g,'').length>15){status(tr('phoneRequired'),true);$('phone').focus();return}
$('send').disabled=true;clearTimeout(timer);const routeReady=await estimate();if(!routeReady){km=null;routeCoords=null;}
let ds=$('dims').value.trim(),nums=ds?ds.split(/[\/;,xх×\s]+/).filter(Boolean).map(Number):null,dims=nums&&nums.length===3&&nums.every(x=>x>0&&Number.isFinite(x))?nums:null;
const orderId='VX-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
let data={order_id:orderId,type:'vukrax_transport_request',version:1,language:$('lang').value,route:{pickup:$('pickup').value.trim(),stops:Array.from(document.querySelectorAll('.stopinput')).map(x=>x.value.trim()).filter(Boolean),destination:$('destination').value.trim(),distance_km:km,coordinates:routeCoords},date:$('date').value||null,cargo:{description:('['+orderId+'] '+$('cargo').value.trim()).trim(),dimensions_m:dims,dimensions_raw:ds,weight_kg:$('weight').value?Number($('weight').value):null,photo_selected:false},services:{loading:$('loading').checked,unloading:$('unloading').checked},contact:{name:$('name').value.trim(),phone:$('phone').value.trim()},submitted_at:new Date().toISOString()};
try{if(typeof tg.sendData!=='function')throw new Error('sendData unavailable');tg.sendData(JSON.stringify(data));status(tr('sent'))}catch(e){console.error('VUKRAX submission failed',e);status(tr('notTelegram'),true)}finally{$('send').disabled=false}};
lang();
})();
</script></body></html>
